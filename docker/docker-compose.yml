version: "3.8"

services:

  medrag-api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: medrag-api
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../models:/app/models
      - ../mlruns:/app/mlruns
      - ../logs:/app/logs
      - ../reports:/app/reports
    environment:
      - PYTHONPATH=/app
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    restart: unless-stopped
    depends_on:
      - mlflow
    networks:
      - medrag-net

  mlflow:
    image: python:3.11-slim
    container_name: medrag-mlflow
    command: >
      sh -c "pip install mlflow --quiet &&
             mlflow server --host 0.0.0.0 --port 5000
             --backend-store-uri /mlruns
             --default-artifact-root /mlruns"
    ports:
      - "5000:5000"
    volumes:
      - ../mlruns:/mlruns
    restart: unless-stopped
    networks:
      - medrag-net

networks:
  medrag-net:
    driver: bridge
